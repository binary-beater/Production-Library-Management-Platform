name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: lmp_db_test
          MYSQL_USER: lmp_user
          MYSQL_PASSWORD: lmp_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      TZ: UTC
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4

    - name: Install MySQL Client
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client

    - name: Wait for MySQL
      run: |
        until mysqladmin ping -h127.0.0.1 -ulmp_user -plmp_password --silent; do
          echo "Waiting for MySQL..."
          sleep 2
        done

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff Linter
      run: ruff check .

    - name: Run Ruff Formatter Check
      run: ruff format --check .

    - name: Run MyPy Type Checking
      run: mypy .

    - name: Run Bandit Security Scanner
      run: bandit -c pyproject.toml -r app/

    - name: Run Dependency Vulnerability Audit (pip-audit)
      run: pip-audit


    - name: Run Tests with Coverage
      env:
        MYSQL_SERVER: 127.0.0.1
        MYSQL_USER: lmp_user
        MYSQL_PASSWORD: lmp_password
        MYSQL_DB: lmp_db_test
        SECRET_KEY: "supersecretproductiongradejwtsecretkeychangeinproduction"
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    - name: Build Docker Image
      run: docker build -t library-management .
